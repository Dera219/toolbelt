services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: toolbelt
      POSTGRES_PASSWORD: toolbelt-dev-only
      POSTGRES_DB: toolbelt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbelt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
# API against Postgres:
#   TOOLBELT_DATABASE_URL=postgresql+psycopg://toolbelt:toolbelt-dev-only@localhost:5432/toolbelt
#   cd ../api && .venv/bin/alembic upgrade head && .venv/bin/uvicorn app.main:app --reload
